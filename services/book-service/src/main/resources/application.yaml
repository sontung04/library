server:
  port: 8082

spring:
  application:
    name: book-service
  docker:
    compose:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/book_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
